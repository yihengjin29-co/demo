<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金融机构驾驶舱 · 国际AMC</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/screen-layout.css">
  <link rel="stylesheet" href="./styles/executive-view.css">
  <link rel="stylesheet" href="./styles/detail-layout.css">
  <link rel="stylesheet" href="./institution.css">
</head>
<body>
  <div class="screen institution-screen" id="screen">
    <header class="screen-header">
      <div class="screen-brand">
        <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><b id="institutionName">国际AMC</b></span>
      </div>
      <div class="screen-title">
        <span class="title-track left-track"></span>
        <div><h1>金融机构驾驶舱</h1></div>
        <span class="title-track right-track"></span>
      </div>
      <div class="screen-clock"><span id="clock"></span></div>
    </header>

    <div class="screen-context">
      <span class="demo-note"><i></i>交互演示 · 所有数值与事项均为模拟</span>
      <div class="screen-tools">
        <label class="cockpit-switch" for="cockpitSwitch"><span>驾驶舱</span><select id="cockpitSwitch" aria-label="切换驾驶舱">
          <option value="group">集团驾驶舱</option>
          <option value="amc" selected>国际AMC驾驶舱</option>
        </select></label>
        <label for="period">观察月份</label>
        <select id="period">
          <option value="2026-08">2026年08月</option>
          <option value="2026-07">2026年07月</option>
          <option value="2026-06">2026年06月</option>
        </select>
        <button class="bare" data-action="scope">范围与口径</button>
        <button class="bare" data-action="fullscreen" aria-label="切换全屏展示">全屏展示 ⛶</button>
        <button class="bare" data-action="workbench">返回工作台</button>
      </div>
    </div>

    <main class="screen-main institution-main">
      <section class="tier overview-tier institution-overview" aria-label="本机构三类核心指标">
        <article class="category-metric-card" style="--metric-color:var(--cyan)" data-top-card="balance"></article>
        <article class="category-metric-card" style="--metric-color:#66a4ff" data-top-card="financial"></article>
        <article class="category-metric-card" style="--metric-color:var(--green)" data-top-card="capital"></article>
      </section>

      <section class="tier institution-middle" aria-label="战略目标、风险指标监测与资产质量监测">
        <section class="screen-panel business-risk-panel">
          <div class="panel-heading"><h2><i class="heading-mark"></i>资产质量监测</h2><div class="heading-tools"><button class="bare" data-business-config>选择2项</button><button class="bare" data-business-all>全部5项 ↗</button></div></div>
          <div class="business-risk-grid" id="businessRiskGrid"></div>
          <p class="panel-footnote">首页从资产质量指标池中展示2项，点击可查看趋势与说明。</p>
        </section>

        <section class="screen-panel risk-monitor-panel">
          <div class="panel-heading"><h2><i class="heading-mark"></i>风险指标监测</h2><div class="heading-tools"><small>当前值 · 阈值区间 · 最近4季度趋势</small></div></div>
          <div class="risk-summary" id="riskSummary"></div>
          <div class="risk-tabs" id="riskTabs" role="tablist" aria-label="风险分类"></div>
          <div class="risk-metric-list" id="riskMetricList" aria-live="polite"></div>
          <div class="risk-band-legend"><span><i class="normal"></i>正常区间</span><span><i class="attention"></i>黄灯预警区间</span><span><i class="severe"></i>红灯预警区间</span><small>分段槽表示状态区间，非等距数轴；定位针表示当前值</small></div>
        </section>

        <section class="screen-panel strategy-panel">
          <div class="panel-heading"><h2><i class="heading-mark"></i>战略目标达成</h2><div class="heading-tools"><small>年度预算执行</small></div></div>
          <div class="strategy-gauges">
            <button class="strategy-gauge" data-detail="营业收入目标" data-detail-text="年度预算500.0亿元，本期累计实现350.6亿元，预算进度70.1%。">
              <strong>营业收入<small>（亿元）</small></strong>
              <svg viewBox="0 0 140 82"><path class="gauge-track" d="M18 70A52 52 0 0 1 122 70" pathLength="100"/><path class="gauge-value cyan-gauge" d="M18 70A52 52 0 0 1 122 70" pathLength="100" stroke-dasharray="70.1 100"/><line x1="70" y1="70" x2="88" y2="39"/><circle cx="70" cy="70" r="4"/></svg>
              <b>350.6亿元</b><em class="green">进度 70.1% · 达标</em>
            </button>
            <button class="strategy-gauge" data-detail="归母净利润目标" data-detail-text="年度预算500.0亿元，本期累计实现245.5亿元，预算进度49.1%，当前未达序时目标。">
              <strong>归母净利润<small>（亿元）</small></strong>
              <svg viewBox="0 0 140 82"><path class="gauge-track" d="M18 70A52 52 0 0 1 122 70" pathLength="100"/><path class="gauge-value red-gauge" d="M18 70A52 52 0 0 1 122 70" pathLength="100" stroke-dasharray="49.1 100"/><line x1="70" y1="70" x2="69" y2="34"/><circle cx="70" cy="70" r="4"/></svg>
              <b>245.5亿元</b><em class="red">进度 49.1% · 未达标</em>
            </button>
            <button class="strategy-gauge" data-detail="年化ROE目标" data-detail-text="年度目标7.2%，本期年化ROE为7.6%，已达到年度目标要求。">
              <strong>年化ROE<small>（%）</small></strong>
              <svg viewBox="0 0 140 82"><path class="gauge-track" d="M18 70A52 52 0 0 1 122 70" pathLength="100"/><path class="gauge-value cyan-gauge" d="M18 70A52 52 0 0 1 122 70" pathLength="100" stroke-dasharray="86 100"/><line x1="70" y1="70" x2="98" y2="43"/><circle cx="70" cy="70" r="4"/></svg>
              <b>7.6%</b><em class="green">目标达成 · 达标</em>
            </button>
          </div>
        </section>
      </section>

      <section class="tier institution-bottom" aria-label="舆情与重大事件">
        <section class="screen-panel compact-feed-panel" id="sentimentPanel">
          <div class="panel-heading"><h2><i class="heading-mark"></i>舆情监测</h2><div class="heading-tools"><div class="feed-controls"><button data-feed="news:-1" aria-label="上一条舆情">‹</button><button data-pause="news" aria-label="暂停舆情轮播">Ⅱ</button><button data-feed="news:1" aria-label="下一条舆情">›</button></div><button class="bare" data-all="news">全部 ↗</button></div></div>
          <div class="compact-columns news-columns"><span>舆情信息</span><span>重要程度</span><span>等级</span><span>发布时间</span></div>
          <div class="compact-stream" id="newsStream"></div>
        </section>

        <section class="screen-panel compact-feed-panel" id="eventPanel">
          <div class="panel-heading"><h2><i class="heading-mark"></i>重大风险事件</h2><div class="heading-tools"><div class="feed-controls"><button data-feed="events:-1" aria-label="上一条事件">‹</button><button data-pause="events" aria-label="暂停事件轮播">Ⅱ</button><button data-feed="events:1" aria-label="下一条事件">›</button></div><button class="bare" data-all="events">全部 ↗</button></div></div>
          <div class="compact-columns event-columns"><span>风险事项</span><span>处置状态</span><span>关注等级</span><span>上报时间</span></div>
          <div class="compact-stream" id="eventStream"></div>
        </section>
      </section>
    </main>

    <footer class="screen-footer"><span>数据截止 <span id="asof">2026-08-31</span> · 本机构报送及风险数据服务（演示）</span><span>指标可下钻 · 事项可追踪 · 来源可回溯</span></footer>
  </div>
  <div id="modalRoot"></div>
  <script src="./institution.js"></script>
</body>
</html>
